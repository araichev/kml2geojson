[project]
name = "kml2geojson"
version = "5.1.0"
description = "A Python library to covert KML files to GeoJSON files"
readme = "README.rst"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alex Raichev", email = "alex@raichev.net" },
]
dependencies = [
    "click>=8.0.1",
]

[project.urls]
Homepage = "https://github.com/araichev/kml2geojson"
Documentation = "https://araichev.github.io/kml2geojson_docs"

[project.scripts]
k2g = "kml2geojson.cli:k2g"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=6.2.5",
    "Sphinx>=4.2.0",
    "publish-sphinx-docs>=1.0.3",
    "pre-commit>=2.18.1",
    "ruff>=0.0.259",
]
githubtest = [
    "pytest>=6.2.5",
]
